async function marketCancelListing(lid){

 if(!confirm('Remove '+listing.card.name+' from the marketplace and return it to your collection?'))return;
 // Close the listing first so it is no longer shown as available.
 listing.status='cancelled';listing.cancelledAt=Date.now();
 if(!await dbPut('market/listings/'+lid,listing)){note('Could not remove listing');return}
 // Return any escrowed offers to their owners because the item is no longer for sale.
 const offers=await dbGet('market/offers/'+lid);
 for(const [oid,off] of Object.entries(offers||{})){
  if(!off||off.status!='pending')continue;
  off.status='cancelled';off.updated=Date.now();
  await dbPut('market/offers/'+lid+'/'+oid,off);
  await dbPut('market/refunds/'+off.buyer+'/'+oid,{cards:off.cards||[],coins:off.coins||0,claimed:false,created:Date.now()});
 }
 const returned=listing.card?JSON.parse(JSON.stringify(listing.card)):null;
 if(returned&&!SAVE.cards.some(c=>c.id==returned.id))SAVE.cards.push(returned);
 if(!SAVE.cards.some(c=>c.id==SAVE.sel))SAVE.sel=SAVE.cards[0]?.id||'';
 applySel();persist();note('Listing removed; player returned to your collection');await marketRefresh();
}
