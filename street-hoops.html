function stepP(p,i,dt){const q=pl[1-p.id],has=p.has,ms=62+p.a.sp*8;if(p.m=='load'&&!has)p.m='free';
 if(p.m=='free'){if(has){if(i.load){p.m='load';p.mt=0}else if(i.cross&&p.cd<=0)cross(p,i)}else if(i.block&&p.cd<=0){p.m='block';p.mt=0}else if(i.swipe&&p.cdS<=0){p.m='swipe';p.mt=0;p.hit=0}}
 const m=p.m;let k=m=='free'?1:m=='load'?.25:0;if(has&&m=='free')k*=.9+.008*p.a.hd;const ac=(m=='cross'?0:m=='shoot'||m=='block'?150:900)*dt;
 p.vx+=Math.max(-ac,Math.min(ac,i.mx*ms*k-p.vx));p.vz+=Math.max(-ac,Math.min(ac,i.mz*ms*k*.65-p.vz));if(m=='cross'){p.vx*=1-3*dt;p.vz*=1-3*dt}
 p.x=Math.max(6,Math.min(274,p.x+p.vx*dt));p.z=Math.max(6,Math.min(144,p.z+p.vz*dt));p.ph+=Math.hypot(p.vx,p.vz)*dt*.095;
 if(m=='load'||m=='shoot')p.f=1;else if(m=='free'||m=='cross'){if(p.id==G.off){if(Math.abs(p.vx)>14)p.f=p.vx>0?1:-1}else p.f=q.x>=p.x?1:-1}
 if(m=='load'){if(!i.load){const fl=Math.min(p.mt/.7,1),sw=.05+.006*p.a.sh,e=Math.abs(fl-.58);p.q=e<sw?1:Math.max(0,1-(e-sw)*3.2);p.m='shoot';p.mt=0;p.rel=0}}
 else if(m=='shoot'){const w=Math.min(p.mt/.66,1);p.jy=104*w*(1-w);if(!p.rel&&p.mt>=.317){p.rel=1;shoot(p)}if(p.mt>=.66){p.m='free';p.jy=0}}
 else if(m=='block'){const w=Math.min(p.mt/.62,1);p.jy=96*w*(1-w);if(p.mt>=.62){p.m='free';p.jy=0;p.cd=.45}}
 else if(m=='swipe'){if(!p.hit&&p.mt>=.17){p.hit=1;swipe(p,q)}if(p.mt>=.42){p.m='free';p.cdS=.5}}
 else if(m=='cross'){if(p.mt>=.5)p.m='free'}else if(m=='stumble'){if(p.mt>=.9)p.m='free'}}
function ai(p){const q=pl[0],i={mx:0,mz:0,load:0,block:0,swipe:0,cross:0},dd=Math.hypot(q.x-p.x,(q.z-p.z)*1.3),dt=1/60;
 const to=(tx,tz,s)=>{const dx=tx-p.x,dz=tz-p.z,l=Math.hypot(dx,dz);if(l>4){i.mx=dx/l*s;i.mz=dz/l*s}};
 if(p.has){const dh=Math.hypot(p.x-HX,p.z-HZ);p.at+=dt;if(p.m=='load')i.load=p.mt<p.hold?1:0;
  else if(p.m=='free'){to(205+Math.sin(G.t*.9)*22,75+Math.sin(G.t*1.4)*45,1);if(dh<125&&p.at>.7&&(dd>30||Math.random()<dt*.6)){i.load=1;p.hold=.7*(.58+(Math.random()-.5)*(.4-.034*p.a.sh));p.at=0}if(dd<44&&p.cd<=0&&Math.random()<dt*(.4+.09*p.a.hd))i.cross=1}}
 else if(ball.st=='held'){to(q.x+(HX-q.x)*.2,q.z+(HZ-q.z)*.2,.9+.01*p.a.df);if(q.m=='load'||(q.m=='shoot'&&!q.rel)){p.rc+=dt;if(p.rc>.08+(10-p.a.df)*.03&&dd<50&&p.cd<=0)i.block=1}else p.rc=0;if(dd<32&&p.cdS<=0&&Math.random()<dt*(.3+.08*p.a.df))i.swipe=1}
 else if(ball.st=='loose'||ball.st=='net')to(ball.x,ball.z,1);else to(HX-30,HZ,.8);return i}
const inp={mx:0,mz:0,a:0,ae:0,be:0,jx:0,jz:0,tA:0},K={};
function myIn(p){const a=p.has,i={mx:inp.mx,mz:inp.mz,load:inp.a&&a?1:0,block:inp.ae&&!a?1:0,swipe:inp.be&&!a?1:0,cross:inp.be&&a?1:0};inp.ae=inp.be=0;return i}
function updBall(dt){if(ball.st=='held'){const p=pl[ball.o],J=p.J;if(p.m=='load'||p.m=='shoot'){const a=J.ar[0][1],b=J.ar[1][1];ball.x=p.x+p.f*lp(a[0],b[0],.5);ball.y=Math.max(5,lp(a[1],b[1],.5));ball.z=p.z}
  else{p.dp+=dt*(7+3*Math.min(1,Math.hypot(p.vx,p.vz)/90));ball.x=p.x+p.f*(p.m=='cross'?lp(15,-8,Math.abs(Math.sin(p.mt*6.3))):15);ball.z=p.z;ball.y=5+27*Math.abs(Math.sin(p.dp))}ball.rot+=dt*3;return}
 const py=ball.y;ball.vy+=GR*dt;ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.y+=ball.vy*dt;ball.rot+=ball.vx*dt*.08+.1;if(ball.st=='loose')ball.lt+=dt;
 if(ball.st=='fly'&&py>RM&&ball.y<=RM&&ball.vy<0){const t=(py-RM)/(py-ball.y),cx=lp(ball.x-ball.vx*dt,ball.x,t),cz=lp(ball.z-ball.vz*dt,ball.z,t),dd=Math.hypot(cx-HX,cz-HZ);
  if(dd<5.4)score();else if(dd<11.5){ball.vy=-ball.vy*.5;ball.vx+=(cx-HX)/dd*70;ball.vz+=(cz-HZ)/dd*70;ball.y=RM+1;G.sh=.1}}
 if(ball.x>256&&ball.vx>0&&ball.y>84&&ball.y<134&&Math.abs(ball.z-HZ)<26){ball.vx*=-.45;ball.x=256}
 if(ball.x<2||ball.x>278){ball.vx*=-.5;ball.x=Math.max(2,Math.min(278,ball.x))}if(ball.z<2||ball.z>148){ball.vz*=-.5;ball.z=Math.max(2,Math.min(148,ball.z))}
 if(ball.y<4.8){ball.y=4.8;if(Math.abs(ball.vy)>30)ball.vy*=-.64;else ball.vy=0;ball.vx*=.85;ball.vz*=.85;if(ball.st=='fly'||ball.st=='net'){ball.st='loose';ball.lt=0}}
 if(ball.st=='loose'&&G.st=='play'&&ball.lt>.25&&ball.y<38){let b=null,bs=99;for(const p of pl){const dd=Math.hypot(p.x-ball.x,p.z-ball.z),s=dd-p.a.h*.7-p.a.df*.3-(p.m=='block'?4:0);if(dd<18&&s<bs){bs=s;b=p}}if(b){ball.st='held';ball.o=b.id;G.off=b.id;ball.vx=ball.vy=ball.vz=0}}}
function over(s){G.st='over';const o=$('ov');o.style.display='flex';o.innerHTML='<div class=box style="text-align:center"><h1>'+(s?'YOU LOST':'YOU WIN!')+'</h1><p>'+G.sc[0]+' - '+G.sc[1]+' vs '+op.name+'</p><button class=big data-a=re>REMATCH</button><button class=big data-a=new style="background:var(--ac)">NEW OPPONENT</button><button class=big data-a=ed style="background:#7aa8ff">EDIT MY PLAYER</button></div>'}
function upd(dt){G.t+=dt;pl.forEach(p=>p.mt+=dt);if(G.st=='setup'||G.st=='over'){pl.forEach(p=>{p.has=false;p.J=rig(p,G.t)});return}
 if(G.msg){G.msg.t+=dt;if(G.msg.t>1.6)G.msg=null}G.sh=Math.max(0,G.sh-dt);G.net=Math.max(0,G.net-dt*1.6);if(G.st=='intro'){G.it-=dt;if(G.it<=0)G.st='play'}
 const live=G.st=='play',Z={mx:0,mz:0,load:0,block:0,swipe:0,cross:0};if(!live)inp.ae=inp.be=0;pl.forEach(p=>{p.cd-=dt;p.cdS-=dt;p.has=ball.st=='held'&&ball.o==p.id});
 pl.forEach(p=>stepP(p,live?(p.id?ai(p):myIn(p)):Z,dt));
 const[a,b]=pl,dx=b.x-a.x,dz=(b.z-a.z)*1.3,d=Math.hypot(dx,dz);if(d<11&&d>.01&&a.jy<8&&b.jy<8){const m=(11-d)/2;a.x-=dx/d*m;b.x+=dx/d*m;a.z-=dz/d*m/1.3;b.z+=dz/d*m/1.3}
 pl.forEach(p=>p.J=rig(p,G.t));updBall(dt);
 if(G.st=='scored'){const s=ball.last;G.rt+=dt;pl.forEach(p=>{if(p.m=='free'){p.m=p.id==s?'cheer':'sad';p.mt=0}});if(G.rt>2.1){if(G.sc[s]>=11)over(s);else tipOff(1-s)}}}
/* ---------- setup UI ---------- */
const ov=$('ov');
function setupUI(){G.st='setup';ov.style.display='flex';ov.innerHTML='<div class=box><h1>STREET HOOPS 1v1</h1><p>Spend 10 points. First to 11 wins. Taller players get longer legs, arms and torso, not a bigger head.</p><div class=cards><div class=card><h3>YOU</h3><canvas id=pv0 width=120 height=160></canvas><div class=ht id=ht0></div><div class=sw>'+JC.map(c=>'<u data-c="'+c+'" style="background:'+c+'"></u>').join('')+'</div><div id=attrs></div></div><div class=card><h3 id=on></h3><canvas id=pv1 width=120 height=160></canvas><div class=ht id=ht1></div><div id=oatt></div><button id=rr>REROLL OPPONENT</button></div></div><button class=big id=go>START</button></div>';render()}
function render(){pts=10-Object.values(me.a).reduce((s,v)=>s+v-1,0);
 $('attrs').innerHTML=KEYS.map(([k,n,d])=>'<div class=row><div><b>'+n+'</b> <span class=v>'+me.a[k]+'</span><br><small>'+d+'</small></div><span><button data-k='+k+' data-d=-1>-</button><button data-k='+k+' data-d=1>+</button></span></div>').join('');
 $('oatt').innerHTML=KEYS.map(([k,n])=>'<div class=ob><span>'+n+'</span><i><b style="width:'+op.a[k]*10+'%"></b></i><em>'+op.a[k]+'</em></div>').join('');
 $('ht0').textContent=inch(me.a.h);$('ht1').textContent=inch(op.a.h);$('on').textContent=op.name.toUpperCase();$('go').disabled=pts>0;$('go').textContent=pts>0?'SPEND '+pts+' MORE POINTS':'START MATCH'}
function pv(){for(const[id,p]of[['pv0',me],['pv1',op]]){const e=$(id);if(!e)continue;const c=e.getContext('2d');c.clearRect(0,0,120,160);c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(60,150,30,7,0,0,7);c.fill();p.f=id=='pv0'?1:-1;p.has=false;p.m='free';p.vx=p.vz=0;p.jy=0;c.save();c.translate(60,150);c.scale(p.f*1.4,1.4);body(c,p,rig(p,G.t));c.restore()}}
function start(){ov.style.display='none';if(op.l.jc==me.l.jc)op.l.jc=JC[(JC.indexOf(me.l.jc)+1)%6];G.sc=[0,0];tipOff(0);G.st='intro';G.it=1.6;msg('FIRST TO 11','#fff')}
ov.onclick=e=>{const t=e.target,d=t.dataset;
 if(d.k){const v=me.a[d.k]+ +d.d;if(v>=1&&v<=10&&(+d.d<0||pts>0)){me.a[d.k]=v;render()}}else if(d.c){me.l.jc=d.c;render()}
 else if(t.id=='rr'){genOpp();render()}else if(t.id=='go'&&pts<=0)start();else if(d.a=='re')start();else if(d.a=='new'){genOpp();start()}else if(d.a=='ed')setupUI()};
/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!K[k]){if(k=='j'||k==' ')inp.ae=1;if(k=='k'||k=='shift')inp.be=1}K[k]=1;if(k==' ')e.preventDefault()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
function kin(){let x=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0)+inp.jx,z=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0)+inp.jz;const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}inp.mx=x;inp.mz=z;inp.a=K.j||K[' ']||inp.tA}
const joy=$('joy'),kn=$('kn');let jp=null;function jm(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-56,dy=e.clientY-r.top-56,l=Math.min(Math.hypot(dx,dy),48)||1,a=Math.atan2(dy,dx);inp.jx=Math.cos(a)*l/48;inp.jz=Math.sin(a)*l/48;kn.style.transform='translate('+inp.jx*32+'px,'+inp.jz*32+'px)'}
joy.onpointerdown=e=>{jp=e.pointerId;joy.setPointerCapture(jp);jm(e)};joy.onpointermove=e=>{if(e.pointerId==jp)jm(e)};joy.onpointerup=joy.onpointercancel=()=>{jp=null;inp.jx=inp.jz=0;kn.style.transform=''};
const ba=$('ba'),bb=$('bb');ba.onpointerdown=()=>{inp.tA=1;inp.ae=1};ba.onpointerup=ba.onpointercancel=ba.onpointerleave=()=>inp.tA=0;bb.onpointerdown=()=>inp.be=1;
let la='',lb='';function lbl(){const A=me.has?'SHOOT':'JUMP',B=me.has?'CROSS':'STEAL';if(A!=la){ba.textContent=la=A}if(B!=lb){bb.textContent=lb=B}}
me.J=rig(me,0);genOpp();setupUI();
let last=performance.now();(function L(t){const dt=Math.min(.033,(t-last)/1000);last=t;kin();upd(dt);draw();if(G.st=='setup')pv();lbl();requestAnimationFrame(L)})(last);
